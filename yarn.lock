# yarn.lock is auto-generated — never edit by hand

# To update a single package safely:
yarn up <package-name>

# To audit for vulnerabilities:
yarn npm audit

# Recommended .yarnrc.yml alongside yarn.lock:
---
nodeLinker: node-modules   # NestJS compat (no PnP)
yarnPath: .yarn/releases/yarn-4.x.x.cjs
enableGlobalCache: false
npmRegistryServer: "https://registry.npmjs.org"

# Add to package.json "scripts" for team enforcement:
"preinstall": "npx only-allow yarn"